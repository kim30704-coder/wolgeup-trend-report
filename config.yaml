# 돈케미 트렌드 리포트 설정
# 여기만 고치면 검색할 주제와 키워드를 바꿀 수 있어요.

google_trends:
  geo: KR            # 국가 코드
  # 급상승 검색어 중 이 단어가 제목이나 관련 뉴스에 들어 있으면 "채널 연관"으로 표시
  relevance_words: [
    월급, 연봉, 직장, 이직, 퇴사, 해고, 채용, 취업, 자격증, 시험, 공무원,
    부동산, 아파트, 청약, 전세, 월세, 대출, 금리, 집값, 분양,
    주식, 코스피, 코스닥, 나스닥, ETF, 배당, 비트코인, 코인, 환율, 엔화, 달러,
    연말정산, 세금, 연금, 국민연금, 실수령, 물가, 생활비,
    AI, 인공지능, 챗GPT, 앤트로픽, 제미나이, 자동화, 반도체, 부업, 창업,
    스마트스토어, 쿠팡, 유튜브, 유튜버, 퇴사, 동기부여, 자기계발, 직업
  ]

youtube:
  region: KR
  language: ko
  days: 7                 # 최근 며칠 안에 올라온 영상을 볼지
  results_per_query: 25   # 검색어당 가져올 영상 수 (최대 50)
  min_views: 10000        # 이보다 조회수가 적은 영상은 제외
  top_n: 15               # 리포트에 보여줄 영상 수 (롱폼/쇼츠 각각)
  
  # 기둥별 검색어. 하나당 할당량 약 100 사용 (하루 무료 10,000 중 약 3,300 사용)
  search_queries:
    # 재테크·직장인 돈
    - 직장인 월급
    - 직장인 생활비
    - 연봉 실수령액
    - 연말정산
    - 재테크
    # EP2 후보 검증용 (2026-11-21 추가)
    - 중도퇴사 연말정산
    - 이직 연말정산
    - 신혼부부 생활비
    - 맞벌이 생활비
    # 부동산
    - 아파트 청약
    - 내집마련
    - 주택담보대출
    # 주식
    - 주식 투자
    - 코스피
    - 미국 ETF 투자
    - 배당주
    # 부업 (스마트스토어 포함)
    - 직장인 부업
    - 스마트스토어 부업
    - 스마트스토어 수익
    # 유튜브하는 법
    - 유튜브 수익
    - 유튜브 시작
    # 직장·직장상담
    - 직장생활
    - 회사생활 현실
    - 퇴사 고민
    # 동기부여
    - 직장인 동기부여
    - 자기계발
    - 30대 인생
    # 이직·직업
    - 이직
    - AI 직업
    - AI 대체 직업
    - 자격증 추천
    - 연봉 높은 직업
  ratio_floor_subs: 1000  # 구독자가 이보다 적은 채널은 이 숫자로 나눠 배수 계산 (구독자 14명 채널이 2000배로 나오는 것 방지)
  # 유튜브 인기 급상승 차트도 볼 카테고리 (25=뉴스/정치, 22=인물/블로그). 뉴스·사건 영상이 섞여서 기본은 끔
  popular_categories: []

naver:
  days: 56          # 최근 며칠치 일별 검색량을 볼지
  compare_days: 14  # 최근 N일 평균과 그 전 N일 평균을 비교
  # 모든 키워드를 이 기준 키워드와 비교해서 "기준 대비 검색량"을 계산 (100 = 기준과 같음)
  anchor:
    name: 재테크
    keywords: [재테크]
  # 키워드 그룹: 그룹 이름 + 같은 뜻의 검색어들(최대 20개)
  keyword_groups:
    - {name: 연말정산, keywords: [연말정산, 연말정산 환급]}
    - {name: 연봉 실수령액, keywords: [연봉 실수령액, 실수령액]}
    - {name: 생활비, keywords: [생활비, 가계부]}
    - {name: 청약, keywords: [청약, 아파트 청약, 무순위 청약]}
    - {name: 주택담보대출, keywords: [주택담보대출, 주담대]}
    - {name: 전세, keywords: [전세, 전세대출]}
    - {name: 국내 주식, keywords: [주식, 코스피, 코스닥]}
    - {name: 미국 ETF, keywords: [미국 ETF, S&P500, 나스닥 ETF]}
    - {name: 배당주, keywords: [배당주, 배당 ETF]}
    - {name: 비트코인, keywords: [비트코인]}
    - {name: 환율, keywords: [환율, 엔화, 달러 환율]}
    - {name: 직장인 부업, keywords: [직장인 부업, 부업 추천]}
    - {name: 스마트스토어, keywords: [스마트스토어, 스마트스토어 부업]}
    - {name: 유튜브 수익, keywords: [유튜브 수익, 유튜브 수익창출, 유튜브 시작]}
    - {name: 직장생활, keywords: [직장생활, 회사생활]}
    - {name: 퇴사, keywords: [퇴사, 퇴사 고민]}
    - {name: 동기부여, keywords: [동기부여, 자기계발]}
    - {name: 이직, keywords: [이직, 이직 준비]}
    - {name: AI 일자리, keywords: [AI 일자리, AI 직업, AI 대체 직업]}
    - {name: 자격증, keywords: [자격증 추천, 유망 자격증, 전기기사]}
    # EP2 후보 검증용 (2026-11-21 추가)
    - {name: 퇴사·이직 연말정산, keywords: [중도퇴사 연말정산, 퇴사 연말정산, 이직 연말정산, 중도퇴사자 연말정산]}
    - {name: 신혼·맞벌이 생활비, keywords: [신혼부부 생활비, 신혼 생활비, 맞벌이 생활비, 부부 생활비]}

# 유튜브 검색 추이 (구글 트렌드 'YouTube 검색' 필터). 키 필요 없음. 비공식이라 막히는 날은 이 항목만 비어요.
youtube_search:
  enabled: true
  geo: KR
  timeframe: today 3-m   # 최근 3개월 일별
  compare_days: 14
  anchor: 연봉           # 기준 키워드(유튜브에서 꾸준히 검색되는 말). 다른 키워드를 이 값 대비로 환산
  related_top: 3         # 키워드마다 같이 급상승한 검색어 몇 개 보여줄지
  related_max: 12        # 관련 검색어를 가져올 키워드 수 상한(요청 수 줄이기)
  keywords: [연봉, 연말정산, 재테크, 주식, 미국 ETF, 부업, 스마트스토어, 청약, 이직, 퇴사, 생활비, 자격증, AI 직업, AI 자격증, 유튜브 수익, 비트코인]

report:
  out_dir: reports
