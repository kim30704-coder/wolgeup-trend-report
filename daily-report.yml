name: 매일 트렌드 리포트

on:
  schedule:
    - cron: "13 22 * * *"   # 매일 07:13 KST (UTC 22:13)
  workflow_dispatch:         # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 리포트 만들기
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python trend_report.py

      - name: 리포트 저장(커밋)
        run: |
          git config user.name "trend-bot"
          git config user.email "trend-bot@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "리포트 $(TZ=Asia/Seoul date +%F)"
          git push
